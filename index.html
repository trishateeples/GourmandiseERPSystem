function normalizeProduct(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"")}
const PLAN_PRODUCT_KEYS=new Set(PRODUCTION_PLAN_PRODUCTS.map(p=>normalizeProduct(p.name)));
